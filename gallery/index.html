<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>九帽动效画廊</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;800&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* layout: a dark screening wall — sticky filter bar, then an auto-fill grid of looping previews; one accent (orange) */
:root {
  --wall: #111110; --card: #191817; --ink: #efe9df; --dim: #958f85; --rule: #2a2826; --hot: #ff6a2b;
  --f-display: 'Noto Serif SC', 'Songti SC', serif;
  --f-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--wall); color: var(--ink); font: 15px/1.6 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--wall); }
.wrap { max-width: 1360px; margin: 0 auto; padding-block: 44px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.kick { font: 600 12px var(--f-mono); letter-spacing: .2em; color: var(--hot); text-transform: uppercase; }
h1 { font: 800 clamp(30px, 4.6vw, 54px)/1.15 var(--f-display); margin: 8px 0 6px; text-wrap: balance; }
.lede { margin: 0; color: var(--dim); max-width: 46em; }
.lede code { font-family: var(--f-mono); color: var(--ink); background: var(--card); padding: 1px 6px; border-radius: 4px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--wall) 92%, transparent); backdrop-filter: blur(8px);
  margin: 26px 0 18px; padding-block: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; border-bottom: 1px solid var(--rule); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button, .chip { font: 500 14px var(--f-body); color: var(--dim); background: transparent; border: 0; padding: 7px 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--wall); }
.chip { border: 1px solid var(--rule); border-radius: 999px; padding: 5px 12px; }
.chip[aria-pressed="true"] { border-color: var(--hot); color: var(--ink); }
.search { flex: 1 1 200px; min-width: 0; font: 14px var(--f-body); color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; }
button:focus-visible, .search:focus-visible, .card:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
.count { font: 12px var(--f-mono); color: var(--dim); margin-left: auto; }
.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.grid.v { grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr)); }
.card { background: var(--card); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; scroll-margin-top: 80px; }
.card .pv { aspect-ratio: 16 / 9; background: #000; display: block; width: 100%; object-fit: cover; }
.grid.v .card .pv { aspect-ratio: 9 / 16; }
.card .meta { padding: 12px 14px 14px; display: grid; gap: 4px; }
.card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.id { font: 600 13px var(--f-mono); color: var(--hot); background: none; border: 0; padding: 0; cursor: copy; }
.cat { font: 12px var(--f-body); color: var(--dim); border: 1px solid var(--rule); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.card h3 { margin: 0; font: 700 16px/1.35 var(--f-body); }
.card p { margin: 0; font-size: 13px; color: var(--dim); }
.card .ref { color: var(--ink); opacity: .75; }
h2 { font: 800 26px var(--f-display); margin: 56px 0 14px; }
.tgrid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--wall);
  font: 600 14px var(--f-body); padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
.empty { color: var(--dim); padding: 40px 0; }
.show { margin-top: 14px; display: grid; grid-template-columns: minmax(0, 16fr) minmax(0, 5.4fr); gap: 18px; align-items: start; }
.show figure { margin: 0; background: var(--card); border-radius: 10px; overflow: hidden; }
.show video { display: block; width: 100%; height: auto; background: #000; }
.show figcaption { padding: 10px 14px 12px; font-size: 13px; color: var(--dim); }
.show figcaption b { color: var(--ink); font-weight: 700; }
@media (max-width: 640px) { .show { grid-template-columns: 1fr; } .show figure:last-child { max-width: 300px; } }
.wall { margin-top: 26px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); }
.tile { position: relative; display: block; text-align: left; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; padding: 0; color: var(--ink); cursor: pointer; font: inherit; }
.tile[aria-pressed="true"] { border-color: var(--hot); box-shadow: 0 0 0 1px var(--hot); }
.tile .tv { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #000; }
.tile .tvv { position: absolute; left: 0; top: 0; pointer-events: none; background: transparent; }
.tile .tm { padding: 8px 10px 10px; display: grid; gap: 1px; }
.tile .tn { font: 700 15px var(--f-body); } .tile .tn code { font: 600 11px var(--f-mono); color: var(--hot); margin-left: 6px; }
.tile .ts { font-size: 12px; color: var(--dim); }
.wall-note { margin: 10px 0 0; font-size: 13px; color: var(--dim); }
.card { position: relative; }
.card .sty { position: absolute; left: 8px; top: 8px; font: 600 11px var(--f-body); color: #fff; background: rgba(0,0,0,.62); border-radius: 999px; padding: 2px 9px; letter-spacing: .02em; pointer-events: none; }
.sel { font: 500 14px var(--f-body); color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 7px 10px; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head><body>

<div class="wrap">
  <div class="kick">hat9-motion · 九帽动效 <a href="fonts.html" style="color:var(--dim);text-decoration:none;margin-left:12px;letter-spacing:.06em;text-transform:none">字体样张 →</a></div>
  <h1>一条口播，变成 AE 级动效成片</h1>
  <p class="lede">26 种风格、180 个效果和 17 种转场，按 VideoHive 销量、YouTube 和 B 站播放量复刻，横屏竖屏同一套代码。每个效果都放在一句真实口播里、用最合适的风格演示；换风格时效果跟着换皮。点效果名复制 id，在 <code>video.json</code> 里写 <code>{"scene":"fx","fx":"<id>"}</code> 就能用。</p>

  <div class="wall" role="group" aria-label="风格" id="wall"></div>
  <p class="wall-note">点一种风格：上面播它的示例成片，下面的动效卡只看这个风格。另有 <code>studio</code> / <code>clay</code> 三维影棚（整片布景，示例在做）。</p>
  <section class="show" aria-label="成片示例">
    <figure><video id="sh-h" controls playsinline preload="metadata"></video><figcaption id="cap-h"></figcaption></figure>
    <figure><video id="sh-v" controls playsinline preload="metadata"></video><figcaption>同一条 · 竖屏 9:16，各自排版</figcaption></figure>
  </section>

  <div class="bar" role="toolbar" aria-label="筛选">
    <div class="seg" role="group" aria-label="画幅">
      <button type="button" id="o-h" aria-pressed="true">横屏 16:9</button><button type="button" id="o-v" aria-pressed="false">竖屏 9:16</button>
    </div>
    <select class="sel" id="sty" aria-label="风格"></select>
    <div id="cats" role="group" aria-label="类别"></div>
    <input class="search" id="q" type="search" placeholder="搜索：标题、照片、数字、转场……" aria-label="搜索效果">
    <span class="count" id="count"></span>
  </div>

  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>没有匹配的效果，换个词试试。</p>

  <h2 id="transitions">转场</h2>
  <div class="tgrid grid" id="tgrid"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(async function () {
  const ROOT = (location.pathname.includes("/gallery/") ? "../" : "") + "assets/previews/";
  const PV = ROOT + "fx/";
  let data = { effects: [], transitions: [], styles: [] };
  try { data = await (await fetch("effects.json")).json(); } catch (e) { document.getElementById("empty").hidden = false; }
  // [style id, 中文名, 适合, film preview prefix (assets/previews/<prefix>_16x9.mp4) or "" , film title]
  const BUILTIN = [
    ["press", "财经刊", "商业拆解、数据口播", "mixue", "一杯 4 块钱的柠檬水"], ["minimal", "极简讲述", "观点、心理、认知", "minimal", "棉花糖实验，测的真是自控力吗"], ["poster", "瑞士海报", "观点、金句", "poster", "专注，就是学会说不"],
    ["zine", "拼贴杂志", "潮玩、年轻消费", "zine", "一只怪兽，一年卖了一百四十多亿"], ["screen", "AI 工具台", "AI 工具、产品", "screen", "8 亿人在用，5% 在付钱"],
    ["hud", "暗场 HUD", "拆解、排序", "", ""], ["atlas", "地图纪录", "贸易、航线、地缘", "atlas", "货船为什么不走苏伊士了"],
    ["doc", "实拍纪录", "历史、行业", "doc", "一个铁箱子"], ["papercut", "剪纸", "节日、民俗", "papercut", "过年看电影，钱押给最好的那一部"],
    ["sketch", "手绘白板", "讲原理、商业模式", "sketch", "Costco 真正卖的是什么"], ["ink", "水墨国风", "国风、文化", "ink", "一只猴子，三天卖出一千万套"],
    ["flat", "扁平插画", "本地生活、城市", "flat", "一份外卖背后的城市网络"], ["pixel", "像素复古", "游戏、互联网", "pixel", "三千二百亿的游戏账本"],
    ["iso3d", "等距微缩", "物流、产业链", "iso3d", "快递的规模账"], ["chrome3d", "Y2K 镀铬", "科技、芯片", "chrome3d", "英伟达：卖铲子的人"],
    ["riso", "孔版印刷", "消费、商业拆解", "riso", "名创优品 2024：增长的那一半在海外"], ["yuefen", "月份牌国货", "老字号、国货", "yuefen", "一瓶白酒的年度账本"],
    ["editorial", "影像杂志", "品牌、商业特写", "editorial", "迅销 2024 财年：优衣库的一年"], ["title", "片头字幕", "财报、悬疑复盘", "title", "Netflix 2024：3 亿会员这一年"],
    ["bauhaus", "包豪斯构成", "观点、比例结构", "bauhaus", "宜家降价的一年"],
    ["thread", "一线长卷", "年报、层层拆解", "thread", "小米的 2024：一条线走完年报"], ["teleshop", "电视购物", "消费、年度账本", "teleshop", "一锅火锅的年度账本"],
    ["vapor", "蒸汽波桌面", "游戏、互联网", "vapor", "任天堂 FY2025 账本"],
    ["reel", "动效库", "快节奏口播", "", ""]];
  // custom styles added with `style_kit.py publish` (listed by catalog.py) join the wall after the built-in ones
  const STYLES = BUILTIN.concat((data.styles || []).filter((s) => !BUILTIN.some((f) => f[0] === s.id))
    .map((s) => [s.id, s.name, s.fits || (s.base ? "基于 " + s.base : ""), s.id, s.title || s.name]));
  const NAME = Object.fromEntries(STYLES.map((s) => [s[0], s[1]]));
  const wallEl = document.getElementById("wall");
  let sty = "全部", filmAt = -1, styIds = [];   // styIds filled once effects.json is in
  const showFilm = (k) => { const f = STYLES[k]; if (!f[3]) return; filmAt = k;
    for (const [id, tag] of [["sh-h", "16x9"], ["sh-v", "9x16"]]) { const v = document.getElementById(id); v.pause(); v.poster = ROOT + f[3] + "_" + tag + ".jpg"; v.src = ROOT + f[3] + "_" + tag + ".mp4"; }
    document.getElementById("cap-h").innerHTML = `<b>《${f[4]}》</b> · 横屏 16:9 · 风格 <code>${f[0]}</code> ${f[1]}`; };
  STYLES.forEach((f, i) => { const b = document.createElement("button"); b.type = "button"; b.className = "tile"; b.dataset.sty = f[0]; b.setAttribute("aria-pressed", "false");
    const poster = ROOT + (f[3] ? f[3] + "_16x9.jpg" : "style_" + f[0] + ".jpg");
    b.innerHTML = `<img class="tv" src="${poster}" alt="${f[1]} 风格" loading="lazy"><span class="tm"><span class="tn">${f[1]}<code>${f[0]}</code></span><span class="ts">${f[2]}</span></span>`;
    if (f[3]) { b.addEventListener("pointerenter", (ev) => { if (ev.pointerType !== "mouse" || b.querySelector("video")) return; const v = document.createElement("video");
      v.className = "tv tvv"; v.muted = true; v.loop = true; v.playsInline = true; v.src = ROOT + f[3] + "_16x9.mp4"; v.poster = poster;
      b.appendChild(v); v.play().catch(() => {}); });   // laid over the poster (never replacing the element being clicked)
      b.addEventListener("pointerleave", () => { const v = b.querySelector("video"); if (v) v.pause(); }); }
    b.onclick = () => { const on = b.getAttribute("aria-pressed") === "true";
      wallEl.querySelectorAll(".tile").forEach((x) => x.setAttribute("aria-pressed", "false"));
      if (on) { setSty("全部"); return; }
      b.setAttribute("aria-pressed", "true"); if (f[3]) showFilm(i);
      setSty(f[0]); };
    wallEl.appendChild(b); });
  showFilm(0);
  let orient = "h", cat = "全部", q = "";
  try { orient = localStorage.getItem("h9-orient") || "h"; } catch (e) {}
  const grid = document.getElementById("grid"), tgrid = document.getElementById("tgrid");
  const styEl = document.getElementById("sty");
  styIds = [...new Set(data.effects.map((e) => e.style || "reel"))];
  styEl.innerHTML = `<option value="全部">全部风格</option>` + STYLES.filter((f) => styIds.includes(f[0])).map((f) => `<option value="${f[0]}">${f[1]} · ${f[0]}</option>`).join("");
  styEl.onchange = () => setSty(styEl.value);
  function setSty(v) { sty = styIds.includes(v) ? v : "全部"; styEl.value = sty;
    wallEl.querySelectorAll(".tile").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.sty === v && v !== "全部"))); render(); }
  const cats = ["全部", ...new Set(data.effects.map((e) => e.cat))];
  const catsEl = document.getElementById("cats");
  cats.forEach((c) => { const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = c; b.setAttribute("aria-pressed", c === cat);
    b.onclick = () => { cat = c; catsEl.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", x.textContent === c)); render(); }; catsEl.appendChild(b); });
  const toast = (msg) => { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 1400); };
  const copy = async (id) => { try { await navigator.clipboard.writeText(id); toast(`已复制 ${id}`); } catch (e) { toast(`效果 id：${id}`); } };
  const esc = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function card(e) {
    const f = e.file || e.id, src = PV + f + (orient === "v" ? "_v" : "") + ".webp";
    const sn = NAME[e.style || "reel"] || e.style_name || "";
    return `<article class="card" id="${f}"><img class="pv" src="${src}" alt="${esc(e.title)} 预览" loading="lazy"><span class="sty">${esc(sn)}</span>
      <div class="meta"><div class="row"><button class="id" type="button" data-id="${e.id}" title="复制效果 id">${e.id}</button><span class="cat">${esc(e.band || e.cat)}</span></div>
      <h3>${esc(e.title.replace(/\s*\(.*$/, ""))}</h3><p>${esc(e.suit)}</p><p class="ref">${esc(e.ref)}</p></div></article>`;
  }
  function render() {
    const k = q.trim().toLowerCase();
    const list = data.effects.filter((e) => (cat === "全部" || e.cat === cat) && (sty === "全部" || (e.style || "reel") === sty)
      && (!k || [e.id, e.title, e.suit, e.cat, e.how, NAME[e.style || "reel"] || ""].join(" ").toLowerCase().includes(k)));
    grid.className = "grid" + (orient === "v" ? " v" : "");
    grid.innerHTML = list.map(card).join("");
    document.getElementById("empty").hidden = list.length > 0;
    const nfx = new Set(data.effects.map((e) => e.id)).size;
    document.getElementById("count").textContent = `${list.length} 张卡 · ${nfx} 个效果 · ${data.transitions.length} 种转场`;
    tgrid.className = "tgrid grid" + (orient === "v" ? " v" : "");
    tgrid.innerHTML = data.transitions.map((t) => `<article class="card" id="tr-${t.id}"><img class="pv" src="${PV + t.file + (orient === "v" ? "_v" : "")}.webp" alt="${esc(t.label)}" loading="lazy">
      <div class="meta"><div class="row"><button class="id" type="button" data-id="${t.id}">${t.id}</button></div><p>${esc(t.label)}</p></div></article>`).join("");
  }
  document.addEventListener("click", (ev) => { const b = ev.target.closest(".id"); if (b) copy(b.dataset.id); });
  const setO = (o) => { orient = o; try { localStorage.setItem("h9-orient", o); } catch (e) {}
    document.getElementById("o-h").setAttribute("aria-pressed", o === "h"); document.getElementById("o-v").setAttribute("aria-pressed", o === "v"); render(); };
  document.getElementById("o-h").onclick = () => setO("h"); document.getElementById("o-v").onclick = () => setO("v");
  document.getElementById("q").addEventListener("input", (ev) => { q = ev.target.value; render(); });
  setO(orient);
  if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
})();
</script>

</body></html>
