<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>九帽字体样张</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* layout: same dark screening wall as the effects gallery — sticky filter bar, then a single column of specimen cards */
:root {
  --wall: #111110; --card: #191817; --ink: #efe9df; --dim: #958f85; --rule: #2a2826; --hot: #ff6a2b; --warn: #f0be50;
  --f-display: 'Noto Serif SC', 'Songti SC', serif;
  --f-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--wall); color: var(--ink); font: 15px/1.6 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--wall); }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 44px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.kick { font: 600 12px var(--f-mono); letter-spacing: .2em; color: var(--hot); text-transform: uppercase; }
.kick a { color: var(--dim); text-decoration: none; margin-left: 12px; letter-spacing: .06em; text-transform: none; }
.kick a:hover { color: var(--ink); }
h1 { font: 800 clamp(30px, 4.6vw, 54px)/1.15 var(--f-display); margin: 8px 0 6px; text-wrap: balance; }
.lede { margin: 0; color: var(--dim); max-width: 50em; }
.lede code, .card code { font-family: var(--f-mono); color: var(--ink); background: var(--card); padding: 1px 6px; border-radius: 4px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--wall) 92%, transparent); backdrop-filter: blur(8px);
  margin: 26px 0 18px; padding-block: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; border-bottom: 1px solid var(--rule); }
.chip { font: 500 14px var(--f-body); color: var(--dim); background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--hot); color: var(--ink); }
select, .search { font: 14px var(--f-body); color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 7px 10px; }
.search { flex: 1 1 200px; min-width: 0; }
label.tog { font-size: 13px; color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }
button:focus-visible, .search:focus-visible, select:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
.count { font: 12px var(--f-mono); color: var(--dim); margin-left: auto; }
.list { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); }
.card { background: var(--card); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; scroll-margin-top: 80px; }
.card img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 1; object-fit: cover; background: #000; }
.meta { padding: 10px 14px 14px; display: grid; gap: 6px; }
.row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.id { font: 600 13px var(--f-mono); color: var(--hot); background: none; border: 0; padding: 0; cursor: copy; }
.lic { font-size: 12px; border: 1px solid var(--rule); border-radius: 999px; padding: 1px 8px; color: var(--dim); white-space: nowrap; }
.lic.free { color: var(--warn); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { font-size: 12px; color: var(--dim); background: #201f1d; border-radius: 4px; padding: 0 6px; }
.note { font-size: 12px; color: var(--dim); margin: 0; overflow-wrap: anywhere; }
h2 { font: 800 22px var(--f-display); margin: 40px 0 12px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--wall);
  font: 600 14px var(--f-body); padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
.empty { color: var(--dim); padding: 40px 0; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="wrap">
  <div class="kick">hat9-motion · 字体样张 <a href="index.html">← 动效画廊</a></div>
  <h1>风格里能用的每一款字体</h1>
  <p class="lede">都登记在 <code>assets/fonts.json</code>。风格的 <code>fonts</code> 里写字体 id 就能用（例：<code>"display": "zcool-kuhei"</code>）。点 id 复制。按情绪搭配的建议见 <code>references/fonts.md</code>。标「免费商用」的字体可以商用，但不随仓库分发，需要自己下载。</p>

  <div class="bar" role="toolbar" aria-label="筛选">
    <div id="cats" role="group" aria-label="类别"></div>
    <select id="mood" aria-label="情绪"><option value="">全部情绪</option></select>
    <input class="search" id="q" type="search" placeholder="搜索：毛笔、可爱、像素、杂志……" aria-label="搜索字体">
    <label class="tog"><input type="checkbox" id="ofl"> 只看可随仓库分发的</label>
    <span class="count" id="count"></span>
  </div>
  <div class="list" id="list"></div>
  <p class="empty" id="empty" hidden>没有匹配的字体，换个词试试。</p>
</div>

<script>
(function () {
  const PV = (location.pathname.includes("/gallery/") ? "../" : "") + "assets/previews/fonts/";
  let data = [];
  try { data = JSON.parse(document.getElementById("font-data").textContent); } catch (e) {}
  const ORDER = ["黑体", "宋体", "楷体与手写", "毛笔", "圆体与可爱", "标题展示", "英文衬线", "英文无衬线", "英文展示", "等宽与像素", "其他文字"];
  let cat = "全部", mood = "", q = "", onlyOfl = false;
  const esc = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const cats = ["全部", ...ORDER.filter((c) => data.some((f) => f.cat === c))];
  const catsEl = document.getElementById("cats");
  cats.forEach((c) => { const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = c; b.setAttribute("aria-pressed", c === cat);
    b.onclick = () => { cat = c; catsEl.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", x.textContent === c)); render(); }; catsEl.appendChild(b); });
  const moods = [...new Set(data.flatMap((f) => f.mood || []))].sort();
  const moodEl = document.getElementById("mood");
  moods.forEach((m) => { const o = document.createElement("option"); o.value = m; o.textContent = m; moodEl.appendChild(o); });
  moodEl.onchange = () => { mood = moodEl.value; render(); };
  document.getElementById("q").addEventListener("input", (e) => { q = e.target.value.trim().toLowerCase(); render(); });
  document.getElementById("ofl").addEventListener("change", (e) => { onlyOfl = e.target.checked; render(); });
  const toast = (msg) => { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 1400); };
  document.addEventListener("click", async (ev) => { const b = ev.target.closest(".id"); if (!b) return;
    try { await navigator.clipboard.writeText(b.dataset.id); toast(`已复制 ${b.dataset.id}`); } catch (e) { toast(`字体 id：${b.dataset.id}`); } });
  const licShort = (l) => l.startsWith("OFL") ? "OFL" : l.startsWith("Apache") ? "Apache" : l.startsWith("IPA") ? "IPA" : "免费商用";
  function card(f) {
    const w = f.weights ? `可变字重 ${f.weights[0]}–${f.weights[1]}` : "";
    const ls = licShort(f.license || "");
    return `<article class="card" id="${esc(f.id)}"><img src="${PV + esc(f.id)}.png" alt="${esc(f.role)} 样张" loading="lazy">
      <div class="meta"><div class="row"><button class="id" type="button" data-id="${esc(f.id)}" title="复制字体 id">${esc(f.id)}</button>
      <span class="lic ${ls === "免费商用" ? "free" : ""}" title="${esc(f.license)}">${ls}${f.redistribute ? "" : " · 不随仓库分发"}</span></div>
      <div class="tags"><span>${esc(f.cat)}</span>${(f.mood || []).map((m) => `<span>${esc(m)}</span>`).join("")}${w ? `<span>${w}</span>` : ""}${f.installed ? "" : "<span>可选 · 未安装</span>"}</div>
      <p class="note">${esc(f.role)}</p></div></article>`;
  }
  function render() {
    const list = data.filter((f) => (cat === "全部" || f.cat === cat) && (!mood || (f.mood || []).includes(mood)) && (!onlyOfl || f.redistribute)
      && (!q || [f.id, f.role, f.cat, (f.mood || []).join(" "), f.script].join(" ").toLowerCase().includes(q)));
    list.sort((a, b) => ORDER.indexOf(a.cat) - ORDER.indexOf(b.cat));
    document.getElementById("list").innerHTML = list.map(card).join("");
    document.getElementById("empty").hidden = list.length > 0;
    document.getElementById("count").textContent = `${list.length} / ${data.length} 款`;
  }
  render();
  if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
})();
</script>
